<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800;900&display=swap">
<style>
:root{--board:#20272e;--ink:#0d1216;--green:#7ed957;--gl:#c9ed8a}
html,body{margin:0}
.c{width:1000px;height:1000px;box-sizing:border-box;position:relative;overflow:hidden;font-family:Heebo,Arial,sans-serif;direction:rtl;color:#fff;
 background:radial-gradient(ellipse at 50% 0%,rgba(126,217,87,.16),transparent 60%),var(--board);
 background-image:radial-gradient(ellipse at 50% 0%,rgba(126,217,87,.16),transparent 60%),linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.04) 2px,transparent 2px);background-size:auto,80px 80px,80px 80px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;border:14px solid var(--green);border-radius:0}
.tag{background:var(--ink);color:var(--green);border:4px solid var(--green);border-radius:999px;padding:6px 40px;font-weight:900;font-size:58px;letter-spacing:3px;direction:ltr}
.t{font-weight:900;font-size:120px;line-height:1}
.card{background:#fff;color:var(--ink);border:10px solid var(--ink);box-shadow:20px 22px 0 var(--ink);border-radius:44px;padding:10px 70px 18px;display:flex;align-items:flex-start;gap:16px;transform:rotate(-2deg)}
.card b{font-size:270px;font-weight:900;line-height:.95;letter-spacing:-6px}
.card i{font-style:normal;font-size:100px;font-weight:900;margin-top:40px}
.s{font-weight:800;font-size:56px;color:var(--gl)}
.box{background:var(--green);color:var(--ink);border:10px solid var(--ink);box-shadow:18px 20px 0 var(--ink);border-radius:40px;padding:0 70px 16px;font-weight:900;font-size:270px;line-height:1.1;transform:rotate(-2deg)}
.t{font-weight:900;font-size:150px;line-height:1}
.logo{position:absolute;bottom:46px;width:250px;opacity:.9}
</style></head><body><div class="c">
<div class="tag">BLACK FRIDAY</div>
<div class="box">חודש</div>
<div class="t">בקהילה</div>
</div></body></html>
